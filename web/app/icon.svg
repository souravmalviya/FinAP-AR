<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Verity logo">
  <defs>
    <linearGradient id="v-check" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#1e40af"/>
      <stop offset="0.55" stop-color="#0d9488"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="v-bars" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2f6fd0"/>
      <stop offset="1" stop-color="#12b886"/>
    </linearGradient>
  </defs>
  <!-- app-icon tile -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="14" fill="#ffffff" stroke="#e6e8ee" stroke-width="1.2"/>
  <!-- growth bars (finance + upward trend) -->
  <rect x="29.5" y="31" width="5.2" height="13" rx="1.4" fill="url(#v-bars)"/>
  <rect x="36.5" y="26" width="5.2" height="18" rx="1.4" fill="url(#v-bars)"/>
  <rect x="43.5" y="20" width="5.2" height="24" rx="1.4" fill="url(#v-bars)"/>
  <!-- navy left arm of the V -->
  <path d="M 16 15 L 31.5 47.5" fill="none" stroke="#16306b" stroke-width="7.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- green checkmark tail (the V's right arm = verification) -->
  <path d="M 31.5 47.5 L 50.5 13.5" fill="none" stroke="url(#v-check)" stroke-width="7.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- accent dot -->
  <circle cx="32.4" cy="54.5" r="2.5" fill="#10b981"/>
</svg>
